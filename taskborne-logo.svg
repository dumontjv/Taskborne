<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <style>
      .logo-text-main { font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 700; fill: #0e0e0e; letter-spacing: -1px; }
      .logo-text-sub { font-family: Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #c8a96e; letter-spacing: 3.5px; }
    </style>
  </defs>

  <!-- Loop icon -->
  <g transform="translate(20, 10)">
    <!-- Outer loop path -->
    <path d="M40 50 C40 30 52 22 62 30 L74 40 C80 45 86 45 92 40 L104 30 C114 22 126 30 126 50 C126 70 114 78 104 70 L92 60 C86 55 80 55 74 60 L62 70 C52 78 40 70 40 50 Z"
      fill="none" stroke="#0e0e0e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center dot -->
    <circle cx="83" cy="50" r="8" fill="#c8a96e"/>
    <!-- Small accent dots -->
    <circle cx="62" cy="30" r="3" fill="#0e0e0e" opacity="0.3"/>
    <circle cx="104" cy="70" r="3" fill="#0e0e0e" opacity="0.3"/>
  </g>

  <!-- Wordmark -->
  <text x="162" y="68" class="logo-text-main">Taskborne</text>
  <text x="163" y="90" class="logo-text-sub">AI AUTOMATION</text>
</svg>
